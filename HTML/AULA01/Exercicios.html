<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisao JS</title>
</head>
<body>
    <h1>Exercicio 1</h1>
    <input type="number" id="hora" placeholder="Selecione o horario da tarefa">
    <input type="number" id="prioridade" placeholder="Indique o nivel de prioridade da tarefa de 0 a 10">
    <button onclick="Agenda()">botao</button>
    <script src="Ex1.js"></script>

    <h1>Exercicio 2</h1>
    <input type="number" id="salario" placeholder="Quantia ganha por mês">
    <input type="number" id="aluguel" placeholder="Indique quanto você paga de aluguel">
    <input type="number" id="alimentacao" placeholder="Indique quanto você gasta com alimentacao">
    <input type="number" id="lazer" placeholder="Indique quanto você gasta com lazer">
    <button onclick="Financeiro()">botao</button>
    <script src="Ex2.js"></script>

    <h1>Exercicio 3</h1>
    <input type="text" id="nome" placeholder="Digite seu nome">
    <button onclick="limparNomeContato()">botao</button>
    <script src="Ex3.js"></script>

    <h1>Exercicio 4</h1>
    <h4 id="mensagem3" style="color: blue;"></h4>
    <button onclick="agendaCompromisso()">Ver dias restantes</button>
    <script src="Ex4.js"></script>

    <h1>Exercicio 5</h1>
    <h2>Lista de horarios para agendar:</h2>
    <p>8, 12, 25, 15, -2, 20</p>
    <h3" id="mensagem" style="color: blue;"></h3>
    <h3" id="mensagem2" style="color: rgb(255, 0, 0);"></h3>
    <button onclick="filtrarAgenda()">Filtrar</button>
    <script src="Ex5.js"></script>
</body>
</html>
