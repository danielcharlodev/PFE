<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Exercicios.css">
    <title>Exercicios</title>
</head>
<body>
    <h1>Conversor Celsius</h1>

  <input type="number" id="celsius" placeholder="Temperatura (°C)">
  <button onclick="converter()" id="botao">Converter</button>

  <p id="resultado"></p>

  <script src="Ex1.js"></script>

      <div class="container">
    <div class="form">
      <label>Nome</label>
      <input id="inpNome" type="text" placeholder="Ex: Daniel" />

      <label>Cargo</label>
      <input id="inpCargo" type="text" placeholder="Ex: Desenvolvedor" />

      <label>Cor do cartão</label>
      <select id="selCor">
        <option value="#2563eb">Azul</option>
        <option value="#16a34a">Verde</option>
        <option value="#dc2626">Vermelho</option>
        <option value="#7c3aed">Roxo</option>
        <option value="#f59e0b">Laranja</option>
      </select>
    </div>

    <div class="card" id="card">
      <div class="nome" id="outNome">Seu Nome</div>
      <div class="cargo" id="outCargo">Seu Cargo</div>
    </div>
  </div>

  <script src="Ex2.js"></script>
</body>
</html>
