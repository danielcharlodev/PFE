<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <div class="container">
        <div class="nav">
            <i class="fa-brands fa-instagram fa-2xs" id="instagram"></i>

            <div class="menu">
                <i class="fa-solid fa-house fa-2xs"></i>
                <i class="fa-solid fa-play fa-2xs"></i>
                <i class="fa-solid fa-paper-plane fa-2xs"></i>
                <i class="fa-solid fa-magnifying-glass fa-2xs"></i>
                <i class="fa-regular fa-compass fa-2xs"></i>
                <i class="fa-regular fa-heart fa-2xs"></i>
                <i class="fa-solid fa-plus fa-2xs"></i>
                <i class="fa-solid fa-circle-user fa-2xs"></i>
            </div>

            <i class="fa-solid fa-bars fa-2xs" id="menu"></i>
            <i class="fa-solid fa-cubes fa-2xs" id="meta"></i>
        </div>

        <div class="main-area">
            <div class="feed">
                <div class="feed-container">
                    <div class="stories">
                        <div class="stories-perfil"></div>
                        <div class="stories-perfil"></div>
                        <div class="stories-perfil"></div>
                        <div class="stories-perfil"></div>
                        <div class="stories-perfil"></div>
                        <div class="stories-perfil"></div>
                    </div>

                    <div class="posts">
                        <div class="post">
                            <div class="topo-post">
                                <div class="foto-perfil">
                                    <img src="img/pai do pequenino.jpg" alt="pai pequenino">
                                </div>

                                <div class="info-post">
                                    <div class="linha-nome">
                                        <span class="nome">pai do pequenino</span>
                                        <span class="tempo">• 3 h</span>
                                    </div>

                                    <div class="localizacao">
                                        Vancouver, na Colômbia Britânica, Canadá
                                    </div>
                                </div>
                            </div>

                            <img src="img/o pequenino.jpg" alt="pequenino" class="imagem-post">

                            <div class="acoes">
                                <i class="fa-regular fa-heart"></i>
                                <i class="fa-regular fa-comment"></i>
                                <i class="fa-solid fa-paper-plane"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="sugestoes">
                <div class="perfil-atual">
                    <div class="perfil-foto"></div>
                    <div>
                        <div class="perfil-nome">rick.ch1</div>
                        <div class="perfil-sub">Daniel Charlo</div>
                    </div>
                </div>

                <h4>Sugestões para você</h4>

                <div class="sugestao">
                    <div class="perfil-foto pequeno"></div>
                    <span>Pessoa 1</span>
                    <a href="#">Seguir</a>
                </div>

                <div class="sugestao">
                    <div class="perfil-foto pequeno"></div>
                    <span>Pessoa 2</span>
                    <a href="#">Seguir</a>
                </div>

                <div class="sugestao">
                    <div class="perfil-foto pequeno"></div>
                    <span>Pessoa 3</span>
                    <a href="#">Seguir</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
